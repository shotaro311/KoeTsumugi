name: "KoeTsumugi Release"

on:
  workflow_dispatch:

concurrency:
  group: handy-m-release
  cancel-in-progress: false

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require shotaro/custom
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != "shotaro/custom" ]; then
            echo "KoeTsumugi releases must run from shotaro/custom, not $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate versions
        id: version
        shell: bash
        run: |
          TAURI_VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          PACKAGE_VERSION=$(grep -o '"version": "[^"]*"' package.json | head -1 | cut -d'"' -f4)
          CARGO_VERSION=$(grep -o '^version = "[^"]*"' src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)

          if [ "$TAURI_VERSION" != "$PACKAGE_VERSION" ] || [ "$TAURI_VERSION" != "$CARGO_VERSION" ]; then
            echo "Version mismatch: tauri=$TAURI_VERSION package=$PACKAGE_VERSION cargo=$CARGO_VERSION" >&2
            exit 1
          fi

          echo "version=$TAURI_VERSION" >> "$GITHUB_OUTPUT"

      - name: Require macOS signing and notarization secrets
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "Required macOS release secret is missing: $name" >&2
              exit 1
            fi
          done

      - name: Create draft KoeTsumugi release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            const notes = require('node:fs').readFileSync(`src/content/release-notes/${version}.md`, 'utf8');
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            for (const release of releases) {
              if (release.draft && release.name === `KoeTsumugi v${version}`) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id
                });
              }
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `handy-m-v${version}`,
              target_commitish: context.sha,
              name: `KoeTsumugi v${version}`,
              body: `声紬（KoeTsumugi）${version}\n\n${notes}\n\nWindows x64 / Apple Silicon Mac対応。本家Handyをもとにした非公式の派生版で、専用の更新経路を使用します。`,
              draft: true,
              prerelease: false,
              generate_release_notes: false
            });
            return data.id;

  build-windows:
    permissions:
      contents: write
    needs: create-release
    uses: ./.github/workflows/build.yml
    with:
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      build-args: "--config src-tauri/tauri.updater.conf.json --bundles nsis"
      sign-binaries: false
      asset-prefix: handy-m
      release-id: ${{ needs.create-release.outputs.release-id }}
      release-tag-prefix: handy-m-v
      upload-artifacts: false
      no-cache: true
    secrets: inherit

  build-macos-arm64:
    permissions:
      contents: write
    needs: [create-release, build-windows]
    uses: ./.github/workflows/build.yml
    with:
      platform: macos-26
      target: aarch64-apple-darwin
      build-args: "--config src-tauri/tauri.updater.conf.json --target aarch64-apple-darwin --bundles app,dmg"
      sign-binaries: true
      asset-prefix: koetsumugi
      release-id: ${{ needs.create-release.outputs.release-id }}
      release-tag-prefix: handy-m-v
      upload-artifacts: false
      upload-release-assets: false
      no-cache: true
    secrets: inherit

  publish-release:
    permissions:
      contents: write
    needs: [create-release, build-windows, build-macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed KoeTsumugi release
        uses: actions/github-script@v9
        with:
          script: |
            const releaseId = Number('${{ needs.create-release.outputs.release-id }}');
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100
            });
            const names = assets.map((asset) => asset.name);
            const required = [
              /x64-setup\.exe$/,
              /x64-setup\.exe\.sig$/,
              /aarch64\.dmg$/,
              /aarch64\.app\.tar\.gz$/,
              /aarch64\.app\.tar\.gz\.sig$/,
              /^latest\.json$/
            ];
            for (const pattern of required) {
              if (!names.some((name) => pattern.test(name))) {
                core.setFailed(`Required release asset is missing: ${pattern}; found: ${names.join(', ')}`);
                return;
              }
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              draft: false
            });

  verify-public-macos:
    needs: [create-release, publish-release]
    runs-on: macos-26
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - name: Verify anonymous public DMG and runtime launch
        shell: bash
        run: |
          set -euo pipefail
          export AUDIT_DIR="$RUNNER_TEMP/koetsumugi-public-audit"
          mkdir -p "$AUDIT_DIR"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path(os.environ['AUDIT_DIR'])
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/handy-m-v{os.environ['RELEASE_VERSION']}"
          request = urllib.request.Request(url, headers={'User-Agent': 'KoeTsumugi-release-audit'})
          with urllib.request.urlopen(request, timeout=60) as response:
              release = json.load(response)
          assert not release['draft'] and not release['prerelease']
          asset = next(asset for asset in release['assets'] if asset['name'].endswith('_aarch64.dmg'))
          with urllib.request.urlopen(asset['browser_download_url'], timeout=120) as response:
              content = response.read()
          assert len(content) == asset['size']
          assert 'sha256:' + hashlib.sha256(content).hexdigest() == asset['digest']
          (root / 'KoeTsumugi.dmg').write_bytes(content)
          print('Anonymous DMG download and GitHub digest verified')
          PY
          MOUNT="$AUDIT_DIR/mounted"
          APP_PID=""
          cleanup() {
            if [ -n "$APP_PID" ]; then kill "$APP_PID" 2>/dev/null || true; fi
            hdiutil detach "$MOUNT" -quiet 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "$AUDIT_DIR/KoeTsumugi.dmg" -mountpoint "$MOUNT" -readonly -nobrowse
          APP="$MOUNT/KoeTsumugi.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep 'Authority=Developer ID Application:'
          xcrun stapler validate "$APP"
          xcrun stapler validate "$AUDIT_DIR/KoeTsumugi.dmg"
          spctl --assess --type execute --verbose=2 "$APP"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$AUDIT_DIR/KoeTsumugi.dmg"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$RELEASE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Contents/Info.plist")" = 'com.shotaro.handym'
          "$APP/Contents/MacOS/koetsumugi" --list-devices
          "$APP/Contents/MacOS/koetsumugi" --start-hidden > "$AUDIT_DIR/startup.log" 2>&1 &
          APP_PID=$!
          sleep 5
          kill -0 "$APP_PID"
          echo 'Public macOS signing, notarization, Gatekeeper, version and runtime launch verified'
