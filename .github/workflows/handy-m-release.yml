name: "KoeTsumugi Release"

on:
  workflow_dispatch:

concurrency:
  group: handy-m-release
  cancel-in-progress: false

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require shotaro/custom
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != "shotaro/custom" ]; then
            echo "KoeTsumugi releases must run from shotaro/custom, not $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate versions
        id: version
        shell: bash
        run: |
          TAURI_VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          PACKAGE_VERSION=$(grep -o '"version": "[^"]*"' package.json | head -1 | cut -d'"' -f4)
          CARGO_VERSION=$(grep -o '^version = "[^"]*"' src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)

          if [ "$TAURI_VERSION" != "$PACKAGE_VERSION" ] || [ "$TAURI_VERSION" != "$CARGO_VERSION" ]; then
            echo "Version mismatch: tauri=$TAURI_VERSION package=$PACKAGE_VERSION cargo=$CARGO_VERSION" >&2
            exit 1
          fi

          echo "version=$TAURI_VERSION" >> "$GITHUB_OUTPUT"

      - name: Require macOS signing and notarization secrets
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "Required macOS release secret is missing: $name" >&2
              exit 1
            fi
          done

      - name: Create draft KoeTsumugi release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            for (const release of releases) {
              if (release.draft && release.name === `KoeTsumugi v${version}`) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id
                });
              }
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `handy-m-v${version}`,
              target_commitish: context.sha,
              name: `KoeTsumugi v${version}`,
              body: `KoeTsumugi ${version} — an unofficial Handy derivative for Windows x64 and Apple Silicon Macs, with an independent update channel.`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            });
            return data.id;

  build-windows:
    permissions:
      contents: write
    needs: create-release
    uses: ./.github/workflows/build.yml
    with:
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      build-args: "--config src-tauri/tauri.updater.conf.json --bundles nsis"
      sign-binaries: false
      asset-prefix: handy-m
      release-id: ${{ needs.create-release.outputs.release-id }}
      release-tag-prefix: handy-m-v
      upload-artifacts: false
      no-cache: true
    secrets: inherit

  build-macos-arm64:
    permissions:
      contents: write
    needs: [create-release, build-windows]
    uses: ./.github/workflows/build.yml
    with:
      platform: macos-26
      target: aarch64-apple-darwin
      build-args: "--config src-tauri/tauri.updater.conf.json --target aarch64-apple-darwin --bundles dmg"
      sign-binaries: true
      asset-prefix: koetsumugi
      release-id: ${{ needs.create-release.outputs.release-id }}
      release-tag-prefix: handy-m-v
      upload-artifacts: false
      upload-release-assets: false
      no-cache: true
    secrets: inherit

  publish-release:
    permissions:
      contents: write
    needs: [create-release, build-windows, build-macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed KoeTsumugi release
        uses: actions/github-script@v9
        with:
          script: |
            const releaseId = Number('${{ needs.create-release.outputs.release-id }}');
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100
            });
            const names = assets.map((asset) => asset.name);
            const required = [
              /x64-setup\.exe$/,
              /x64-setup\.exe\.sig$/,
              /aarch64\.dmg$/,
              /aarch64\.app\.tar\.gz$/,
              /aarch64\.app\.tar\.gz\.sig$/,
              /^latest\.json$/
            ];
            for (const pattern of required) {
              if (!names.some((name) => pattern.test(name))) {
                core.setFailed(`Required release asset is missing: ${pattern}; found: ${names.join(', ')}`);
                return;
              }
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              draft: false
            });
